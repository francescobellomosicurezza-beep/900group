    <button type="submit" name="vai" value="riepilogo">
  {% else %}
    <a href="{% url 'novecento:riepilogo' %}">
  {% endif %}
      <span class="carrello-conta" data-carrello-totale>{{ articoli_selezionati }}</span>
      <span class="carrello-testo">
        <strong>Vedi ordine</strong>
        <span data-carrello-etichetta>articol{{ articoli_selezionati|pluralize:"o,i" }} nell'ordine</span>
      </span>
      {% include "novecento/_icona.html" with nome="freccia" %}
  {% if pulsante_form %}</button>{% else %}</a>{% endif %}
</div>
