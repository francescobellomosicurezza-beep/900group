{% extends "novecento/base.html" %}
{% block title %}Account senza sede{% endblock %}
{% block content %}
<h1 class="nv-title">- Accesso non abilitato -</h1>
<div class="alert alert-warning">
  L'account <strong>{{ user.username }}</strong> non è collegato a nessun punto vendita attivo.
  Contatta l'amministratore.
</div>
<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit" class="btn btn-outline-nv btn-lg w-100">Esci</button>
</form>
{% endblock %}
