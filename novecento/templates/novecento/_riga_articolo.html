<li class="nv-articolo{% if valore %} selected{% endif %}" data-nome="{{ articolo.nome|lower }} {{ articolo.codice|lower }}">
  <div class="nv-articolo-info">
    <label for="qta-{{ articolo.pk }}" class="nv-articolo-nome">{{ articolo.nome }}</label>
    <span class="nv-articolo-meta">
      {% if articolo.codice %}<span class="nv-codice">{{ articolo.codice }}</span>{% endif %}
      {{ articolo.confezione }}
      {% if mostra_percorso %}· {{ articolo.gruppo.nome }}{% endif %}
    </span>
    {% if ultima %}<span class="nv-ultima">Ultimo ordine: {{ ultima }}</span>{% endif %}
    {% if errori %}{% for error in errori %}<span class="text-danger small d-block">{{ error }}</span>{% endfor %}{% endif %}
  </div>
  <div class="nv-stepper">
    <button type="button" class="btn btn-outline-nv" data-step="-1" aria-label="Diminuisci {{ articolo.nome }}">−</button>
    <input type="number" name="art_{{ articolo.pk }}" id="qta-{{ articolo.pk }}" value="{{ valore|default_if_none:'' }}"
           class="form-control text-center qty-input" inputmode="numeric" min="0" max="9999" step="1"
           data-articolo="{{ articolo.pk }}" data-gruppo="{{ articolo.gruppo_id }}"
           aria-label="Quantità {{ articolo.nome }}">
    <button type="button" class="btn btn-outline-nv" data-step="1" aria-label="Aumenta {{ articolo.nome }}">+</button>
  </div>
</li>
